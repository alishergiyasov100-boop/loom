<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Холст</title>
<style>
  :root { --bg:#f6f5f3; --card:#fff; --line:#e3e0dc; --ink:#1a1a1c; --dim:#8a8882; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto;
         display:flex; flex-direction:column; height:100vh; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px;
           background:var(--card); border-bottom:1px solid var(--line); }
  h1 { font-size:14px; font-weight:600; margin:0; letter-spacing:.01em }
  .sp { flex:1 }
  button, select { font:inherit; font-size:13px; padding:6px 13px; border:1px solid var(--line);
                   border-radius:999px; background:var(--card); color:var(--ink); cursor:pointer }
  button.go { background:var(--ink); color:#fff; border-color:var(--ink) }
  button:disabled { opacity:.45 }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; padding:16px; min-height:0 }
  canvas { background:#fff; border:1px solid var(--line); border-radius:8px;
           max-width:100%; max-height:100%; image-rendering:auto;
           box-shadow:0 1px 3px rgba(0,0,0,.05) }
  footer { padding:8px 14px; background:var(--card); border-top:1px solid var(--line);
           color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums }
</style>

<header>
  <h1>Холст</h1>
  <select id="clip"></select>
  <select id="speed">
    <option value="1">как рука</option>
    <option value="3">втрое быстрее</option>
    <option value="0">мгновенно</option>
  </select>
  <button id="onion">онион: выкл</button>
  <div class="sp"></div>
  <button id="go" class="go">Рисовать</button>
</header>

<div class="stage"><canvas id="c" width="512" height="512"></canvas></div>
<footer id="st">готов</footer>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const st = document.getElementById('st');
let clip = null, playing = false, onion = false;

function clear() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); }

function drawStrokePartial(s, upto, color, alpha) {
  const w = cv.width, h = cv.height;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = color || '#141416';
  ctx.lineWidth = Math.max(1, s.w * w / 256);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const p = s.pts;
  ctx.moveTo(p[0][0] * w, p[0][1] * h);
  for (let i = 1; i <= upto && i < p.length; i++) ctx.lineTo(p[i][0] * w, p[i][1] * h);
  ctx.stroke();
  ctx.restore();
}

function drawFrame(fr, ghosts) {
  clear();
  if (ghosts) ghosts.forEach((g, k) => g.strokes.forEach(s =>
    drawStrokePartial(s, s.pts.length, '#000', 0.10 + 0.06 * k)));
  fr.strokes.forEach(s => drawStrokePartial(s, s.pts.length));
}

const wait = ms => new Promise(r => setTimeout(r, ms));

/* вот это и есть «рисует, а не появляется»: линия растёт по точкам */
async function handDraw(fr, ghosts, speed) {
  if (speed === 0) { drawFrame(fr, ghosts); return; }
  clear();
  if (ghosts) ghosts.forEach((g, k) => g.strokes.forEach(s =>
    drawStrokePartial(s, s.pts.length, '#000', 0.10 + 0.06 * k)));
  const done = [];
  for (const s of fr.strokes) {
    for (let i = 1; i < s.pts.length; i++) {
      done.forEach(d => drawStrokePartial(d, d.pts.length));
      drawStrokePartial(s, i);
      await wait(Math.max(2, 26 / speed));
      if (!playing) return;
      clear();
      if (ghosts) ghosts.forEach((g, k) => g.strokes.forEach(x =>
        drawStrokePartial(x, x.pts.length, '#000', 0.10 + 0.06 * k)));
    }
    done.push(s);
    done.forEach(d => drawStrokePartial(d, d.pts.length));
  }
  drawFrame(fr, ghosts);
}

async function play() {
  if (!clip) return;
  playing = true;
  document.getElementById('go').textContent = 'Стоп';
  const speed = +document.getElementById('speed').value;
  cv.width = clip.w; cv.height = clip.h;
  const t0 = performance.now();
  for (let i = 0; i < clip.frames.length && playing; i++) {
    const gh = onion ? clip.frames.slice(Math.max(0, i - 2), i) : null;
    await handDraw(clip.frames[i], gh, speed);
    st.textContent = 'кадр ' + (i + 1) + ' из ' + clip.frames.length +
      '  ·  штрихов ' + clip.frames[i].strokes.length +
      '  ·  ' + ((performance.now() - t0) / 1000).toFixed(1) + ' с';
    if (speed === 0) await wait(1000 / clip.fps);
  }
  playing = false;
  document.getElementById('go').textContent = 'Рисовать';
}

document.getElementById('go').onclick = () => { if (playing) { playing = false; } else play(); };
document.getElementById('onion').onclick = e => {
  onion = !onion; e.target.textContent = 'онион: ' + (onion ? 'вкл' : 'выкл');
};

fetch('clips.json').then(r => r.json()).then(list => {
  const sel = document.getElementById('clip');
  list.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
  const load = () => fetch('clips/' + sel.value).then(r => r.json()).then(c => {
    clip = c; cv.width = c.w; cv.height = c.h; clear();
    st.textContent = c.frames.length + ' кадров · ' + c.frames[0].strokes.length + ' штрихов · ' + c.fps + ' fps';
  });
  sel.onchange = load; load();
});
</script>
